# ==============================================================================
# KONFIGURASI RESMI NGINX PRODUKSI — SIPERAPAT LLDIKTI WILAYAH X
# ==============================================================================
# File: /etc/nginx/sites-available/siperapat (atau /etc/nginx/conf.d/siperapat.conf)
#
# PANDUAN DEPLOYMENT & SISTEM OPERASI (UBUNTU / DEBIAN LINUX):
# ------------------------------------------------------------------------------
# 1. Pastikan paket PHP & dependensi sistem telah terpasang:
#    sudo apt update
#    sudo apt install -y nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-gd \
#                        php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip
#    # Untuk konversi PDF biner otomatis (%PDF-1.7):
#    sudo apt install -y libreoffice-writer fonts-dejavu fonts-liberation
#
# 2. Konfigurasi izin direktori penyimpanan (Storage & Cache):
#    sudo chown -R www-data:www-data /var/www/siperapat/storage /var/www/siperapat/bootstrap/cache
#    sudo chmod -R 775 /var/www/siperapat/storage /var/www/siperapat/bootstrap/cache
#
# 3. PENTING: Direktori FastCGI Temp Nginx (Mencegah Error 500 Permission Denied):
#    sudo mkdir -p /var/lib/nginx/fastcgi
#    sudo chown -R www-data:www-data /var/lib/nginx/fastcgi
#    sudo chmod 700 /var/lib/nginx/fastcgi
#
# 4. Konfigurasi PHP-FPM (/etc/php/8.3/fpm/php.ini):
#    memory_limit = 512M
#    upload_max_filesize = 10M
#    post_max_size = 20M
#    max_execution_time = 120
#
# 5. SERTIFIKAT TLS (WAJIB — sistem mengirim selfie & tanda tangan biometrik):
#    sudo apt install -y certbot python3-certbot-nginx
#    # mkdir -p /var/www/siperapat/public/.well-known/acme-challenge
#    #(chown www-data, agar certbot webroot bisa menulis)
#    sudo certbot --nginx -d siperapat.lldikti10.kemdikbud.go.id
#    # Ganti ssl_certificate / ssl_certificate_key di bawah dengan path hasil certbot:
#    #   /etc/letsencrypt/live/siperapat.lldikti10.kemdikbud.go.id/fullchain.pem
#    #   /etc/letsencrypt/live/siperapat.lldikti10.kemdikbud.go.id/privkey.pem
#    sudo certbot renew --dry-run
#
# 6. VERIFIKASI SETELAH DEPLOY:
#    sudo nginx -t && sudo systemctl reload nginx
#    curl -I https://siperapat.lldikti10.kemdikbud.go.id/up
#    # Harus: HTTP/2 200, header Strict-Transport-Security & X-Frame-Options ada
#    # Uji blokir eksekusi skrip di area upload (harus 404):
#    curl -I https://siperapat.lldikti10.kemdikbud.go.id/storage/x.php
# ==============================================================================

# ------------------------------------------------------------------------------
# BLOK 1 — REDIRECT HTTP -> HTTPS
# ------------------------------------------------------------------------------
# Data yang dilindungi: kredensial login, token CSRF, session cookie, serta foto
# selfie + tanda tangan digital setiap pegawai (data biometrik). Tanpa TLS seluruh
# data tersebut dapat disadap di jaringan, dan header HSTS tidak akan pernah
# dijalankan browser karena hanya berlaku di koneksi yang sudah terenkripsi.
# Allowlist /.well-known/acme-challenge agar pembaruan sertifikat tetap berjalan.
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name siperapat.lldikti10.kemdikbud.go.id; # Sesuaikan dengan domain server Anda

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/siperapat/public;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# BLOK 2 — HTTPS (APLIKASI)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name siperapat.lldikti10.kemdikbud.go.id; # Sesuaikan dengan domain server Anda

    # Lokasi root aplikasi Laravel (wajib mengarah ke folder /public)
    root /var/www/siperapat/public;

    index index.php index.html;
    charset utf-8;

    # Minimalkan banner versi pada header respons
    server_tokens off;

    # --------------------------------------------------------------------------
    # SERTIFIKAT TLS
    # --------------------------------------------------------------------------
    # Ganti ke path hasil certbot (lihat panduan langkah 5 di atas).
    ssl_certificate     /etc/ssl/certs/siperapat.crt;
    ssl_certificate_key /etc/ssl/private/siperapat.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # HSTS di sini (bukan hanya di middleware Laravel) karena memakai flag `always`,
    # sehingga header tetap terkirim pada respons error 4xx/5xx.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=()" always;

    # --------------------------------------------------------------------------
    # 1. Batas Ukuran Upload & Request Body
    # --------------------------------------------------------------------------
    # Mengizinkan upload foto selfie kamera, tanda tangan, dan logo custom agenda
    client_max_body_size 20M;

    # --------------------------------------------------------------------------
    # 2. FastCGI Buffer Tuning (MENCEGAH ERROR 500 PADA EKSPOR WORD & PDF)
    # --------------------------------------------------------------------------
    # Mengalokasikan buffer memory yang cukup agar response dokumen besar (Word .doc /
    # PDF preview) dengan puluhan foto base64 tidak menyebabkan buffer overflow.
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
    fastcgi_busy_buffers_size 64k;
    fastcgi_temp_file_write_size 64k;
    fastcgi_read_timeout 180s;
    fastcgi_send_timeout 180s;
    fastcgi_intercept_errors on;

    # --------------------------------------------------------------------------
    # 3. ASET STATIK (Vite build) — cache jangka panjang karena ber-hash
    # --------------------------------------------------------------------------
    # CATATAN: nginx hanya mewarisi `add_header` dari level atas bila level ini
    # tidak mendefinisikan satupun `add_header`. Karena blok di bawah men-cache
    # sendiri, seluruh header keamanan harus diulang di sini agar tidak hilang.

    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control          "public, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        access_log off;
    }

    # Berkas yang diunggah pengguna memakai nama acak sehingga aman di-cache
    # singkat, dan `sandbox` di CSP mencegah berkas tersebutyscoba memuat
    # sumber daya eksternal bila pernah ditafsirkan sebagai dokumen.
    location ^~ /storage/ {
        # PENTING: prefix match dengan `^~` ini MENGALAHKAN regex `location ~ \.php$`
        # di bawah. Akibatnya berkas di dalam /storage/ tidak pernah boleh diteruskan
        # ke PHP-FPM, sehingga unggahan berekstensi .php/.phtml tidak dapat dieksekusi.
        # Ini adalah defence-in-depth yang berdiri sendiri, terpisah dari validasi
        # ekstensi di sisi aplikasi.
        try_files $uri =404;

        add_header Cache-Control          "public, max-age=300" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;

        expires 5m;
    }

    # Lapis kedua: tolak outright berkas executable/script di area upload.
    location ~* ^/storage/.*\.(php|phtml|php[0-9]|phps|pl|py|cgi|sh|bash|htaccess|inc)$ {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # 4. Routing Standar Laravel
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    # --------------------------------------------------------------------------
    # 5. Pemrosesan Skrip PHP via PHP-FPM
    # --------------------------------------------------------------------------
    # Hanya berkas di dalam root aplikasi yang boleh dieksekusi. Karena blok
    # /storage/ di atas memakai prefix match `^~`, area upload tidak akan pernah
    # sampai ke blok ini.
    location ~ \.php$ {
        # Tolak path yang keluar dari root (proteksi path traversal tambahan).
        try_files $uri =404;

        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Menyembunyikan header versi PHP untuk keamanan
        fastcgi_hide_header X-Powered-By;
    }

    # --------------------------------------------------------------------------
    # 6. Keamanan & Proteksi Berkas Tersembunyi (.env, .git, dll)
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --------------------------------------------------------------------------
    # 7. Kompresi
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 8. Logging
    # --------------------------------------------------------------------------
    access_log /var/log/nginx/siperapat_access.log;
    error_log  /var/log/nginx/siperapat_error.log warn;
}
